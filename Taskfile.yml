version: "3"

tasks:
  sync:
    desc: Install or update API dependencies.
    dir: apps/api
    cmds:
      - uv sync --group dev --group codegen

  ci:sync:
    desc: Install API dependencies from the lockfile for CI.
    dir: apps/api
    cmds:
      - uv sync --frozen --group dev --group codegen

  run:
    desc: Run the FastAPI app locally with the repo-root .env.
    cmds:
      - set -a && . ./.env && set +a && cd apps/api && uv run uvicorn bike_doc_api.main:app --reload

  test:
    desc: Run API tests.
    dir: apps/api
    cmds:
      - uv run pytest

  lint:
    desc: Run API lint checks.
    dir: apps/api
    cmds:
      - uv run ruff check .

  typecheck:
    desc: Run API static type checks.
    dir: apps/api
    cmds:
      - uv run mypy

  format:
    desc: Format API code.
    dir: apps/api
    cmds:
      - uv run ruff format .

  format:check:
    desc: Check API code formatting.
    dir: apps/api
    cmds:
      - uv run ruff format --check .

  check:
    desc: Run the standard local verification suite.
    deps:
      - format:check
      - lint
      - typecheck
      - test

  build:
    desc: Build the API package.
    dir: apps/api
    cmds:
      - uv build

  eval:rear-brake:
    desc: Evaluate recorded rear-brake inference responses and compare the accepted baseline.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/rear-brake-shadow-v1.json --predictions evals/bike-doc/profile-inference/rear-brake-shadow-v1.responses.json --baseline evals/bike-doc/profile-inference/rear-brake-shadow-v1.baseline.json --output /tmp/bike-doc-rear-brake-evaluation.json

  eval:rolling-system:
    desc: Evaluate recorded positioned rolling-system inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/rolling-system-v1.json --predictions evals/bike-doc/profile-inference/rolling-system-v1.responses.json --baseline evals/bike-doc/profile-inference/rolling-system-v1.baseline.json --output /tmp/bike-doc-rolling-system-evaluation.json

  eval:drivetrain-topology:
    desc: Evaluate recorded installed drivetrain topology inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/drivetrain-topology-v1.json --predictions evals/bike-doc/profile-inference/drivetrain-topology-v1.responses.json --baseline evals/bike-doc/profile-inference/drivetrain-topology-v1.baseline.json --output /tmp/bike-doc-drivetrain-topology-evaluation.json

  eval:drivetrain-roles:
    desc: Evaluate recorded installed drivetrain role and identity inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/drivetrain-roles-v1.json --predictions evals/bike-doc/profile-inference/drivetrain-roles-v1.responses.json --baseline evals/bike-doc/profile-inference/drivetrain-roles-v1.baseline.json --output /tmp/bike-doc-drivetrain-roles-evaluation.json

  eval:drivetrain-specifications:
    desc: Evaluate recorded counted and marked drivetrain specification inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/drivetrain-specifications-v1.json --predictions evals/bike-doc/profile-inference/drivetrain-specifications-v1.responses.json --baseline evals/bike-doc/profile-inference/drivetrain-specifications-v1.baseline.json --output /tmp/bike-doc-drivetrain-specifications-evaluation.json

  ci:
    desc: Run the non-Docker CI verification suite.
    cmds:
      - task: ci:sync
      - task: check
      - task: build
