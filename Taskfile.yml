version: "3"

tasks:
  sync:
    desc: Install or update API dependencies.
    dir: apps/api
    cmds:
      - uv sync --group dev --group codegen

  ci:sync:
    desc: Install API dependencies from the lockfile for CI.
    dir: apps/api
    cmds:
      - uv sync --frozen --group dev --group codegen

  run:
    desc: Run the FastAPI app locally with the repo-root .env.
    cmds:
      - set -a && . ./.env && set +a && cd apps/api && uv run uvicorn bike_doc_api.main:app --reload --no-access-log

  test:
    desc: Run API tests.
    dir: apps/api
    cmds:
      - uv run pytest

  test:sessions:
    desc: Verify deferred diagnostic sessions and migrations with disposable PostgreSQL.
    cmds:
      - bash scripts/verify-backend-compatibility.sh sessions

  test:nats:
    desc: Run pinned real-NATS compatibility tests in a disposable broker container.
    cmds:
      - docker compose --env-file .env up -d --wait nats
      - cd apps/api && uv run pytest -m nats tests/integration/test_nats_compatibility.py

  run:diagnostic:
    desc: Run the independent diagnostic worker with the repo-root .env.
    cmds:
      - set -a && . ./.env && set +a && cd apps/api && uv run python -m bike_doc_api.workers.diagnostic_role

  test:diagnostic-canary:
    desc: Run the integrated diagnostic acceptance and PostgreSQL/JetStream failure matrix.
    cmds:
      - bash scripts/verify-backend-compatibility.sh diagnostic-canary

  test:diagnostic:
    desc: Verify diagnostic role with disposable PostgreSQL/JetStream and fake model/providers.
    cmds:
      - bash scripts/verify-backend-compatibility.sh diagnostic

  run:profile:
    desc: Run the independent profile worker with the repo-root .env.
    cmds:
      - set -a && . ./.env && set +a && cd apps/api && uv run python -m bike_doc_api.workers.profile_role

  test:profile-canary:
    desc: Run atomic acceptance and the integrated profile PostgreSQL/JetStream failure matrix.
    cmds:
      - bash scripts/verify-backend-compatibility.sh canary

  test:profile:
    desc: Verify the profile role with disposable PostgreSQL/JetStream and fake extraction.
    cmds:
      - bash scripts/verify-backend-compatibility.sh profile

  test:worker:
    desc: Verify shared pull workers with disposable PostgreSQL and pinned JetStream.
    cmds:
      - bash scripts/verify-backend-compatibility.sh worker

  jobs:reconstruct:
    desc: Finite operator recovery of topology and PostgreSQL notification intent.
    cmds:
      - set -a && . ./.env && set +a && cd apps/api && uv run python -m bike_doc_api.maintenance.reconstruction

  jobs:inspect:
    desc: Read-only PostgreSQL job truth with optional JetStream transport observations.
    cmds:
      - set -a && . ./.env && set +a && cd apps/api && uv run python -m bike_doc_api.operations.inspection {{.CLI_ARGS}}

  test:observability:
    desc: Verify queue observations with disposable PostgreSQL/JetStream and failure injection.
    cmds:
      - bash scripts/verify-backend-compatibility.sh observability

  test:recovery:
    desc: Verify recovery, retention and reconstruction with disposable PostgreSQL/JetStream.
    cmds:
      - bash scripts/verify-backend-compatibility.sh recovery

  test:maintenance:
    desc: Verify maintenance with disposable PostgreSQL and pinned JetStream.
    cmds:
      - bash scripts/verify-backend-compatibility.sh maintenance

  verify:backend-compatibility:
    desc: Run backend compatibility checks with disposable PostgreSQL and NATS.
    cmds:
      - bash scripts/verify-backend-compatibility.sh

  lint:
    desc: Run API lint checks.
    dir: apps/api
    cmds:
      - uv run ruff check .

  typecheck:
    desc: Run API static type checks.
    dir: apps/api
    cmds:
      - uv run mypy

  format:
    desc: Format API code.
    dir: apps/api
    cmds:
      - uv run ruff format .

  format:check:
    desc: Check API code formatting.
    dir: apps/api
    cmds:
      - uv run ruff format --check .

  check:
    desc: Run the standard local verification suite.
    deps:
      - format:check
      - lint
      - typecheck
      - test

  build:
    desc: Build the API package.
    dir: apps/api
    cmds:
      - uv build

  eval:rear-brake:
    desc: Evaluate recorded rear-brake inference responses and compare the accepted baseline.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/rear-brake-shadow-v1.json --predictions evals/bike-doc/profile-inference/rear-brake-shadow-v1.responses.json --baseline evals/bike-doc/profile-inference/rear-brake-shadow-v1.baseline.json --output /tmp/bike-doc-rear-brake-evaluation.json

  eval:rolling-system:
    desc: Evaluate recorded positioned rolling-system inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/rolling-system-v1.json --predictions evals/bike-doc/profile-inference/rolling-system-v1.responses.json --baseline evals/bike-doc/profile-inference/rolling-system-v1.baseline.json --output /tmp/bike-doc-rolling-system-evaluation.json

  eval:drivetrain-topology:
    desc: Evaluate recorded installed drivetrain topology inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/drivetrain-topology-v1.json --predictions evals/bike-doc/profile-inference/drivetrain-topology-v1.responses.json --baseline evals/bike-doc/profile-inference/drivetrain-topology-v1.baseline.json --output /tmp/bike-doc-drivetrain-topology-evaluation.json

  eval:drivetrain-roles:
    desc: Evaluate recorded installed drivetrain role and identity inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/drivetrain-roles-v1.json --predictions evals/bike-doc/profile-inference/drivetrain-roles-v1.responses.json --baseline evals/bike-doc/profile-inference/drivetrain-roles-v1.baseline.json --output /tmp/bike-doc-drivetrain-roles-evaluation.json

  eval:drivetrain-specifications:
    desc: Evaluate recorded counted and marked drivetrain specification inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/drivetrain-specifications-v1.json --predictions evals/bike-doc/profile-inference/drivetrain-specifications-v1.responses.json --baseline evals/bike-doc/profile-inference/drivetrain-specifications-v1.baseline.json --output /tmp/bike-doc-drivetrain-specifications-evaluation.json

  eval:electric-assist:
    desc: Evaluate recorded electric-assist inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/electric-assist-v1.json --predictions evals/bike-doc/profile-inference/electric-assist-v1.responses.json --baseline evals/bike-doc/profile-inference/electric-assist-v1.baseline.json --output /tmp/bike-doc-electric-assist-evaluation.json

  eval:suspension:
    desc: Evaluate recorded suspension inference responses.
    cmds:
      - UV_CACHE_DIR=/tmp/bike-doc-uv-cache uv run --project apps/api python evals/bike-doc/profile-inference/evaluate.py --dataset evals/bike-doc/profile-inference/suspension-v1.json --predictions evals/bike-doc/profile-inference/suspension-v1.responses.json --baseline evals/bike-doc/profile-inference/suspension-v1.baseline.json --output /tmp/bike-doc-suspension-evaluation.json

  ci:
    desc: Run the non-Docker CI verification suite.
    cmds:
      - task: ci:sync
      - task: check
      - task: build

  deployment:validate:
    desc: Validate deployment security, topology and synthetic alert behavior.
    dir: apps/api
    cmds:
      - uv run ruff format --check ../../scripts/prepare-production.py ../../deploy/verify_permissions.py ../../deploy/verify_rotation.py
      - uv run ruff check ../../scripts/prepare-production.py ../../deploy/verify_permissions.py ../../deploy/verify_rotation.py
      - bash -n ../../scripts/verify-production.sh
      - uv run pytest tests/unit/test_deployment.py tests/unit/test_health.py
      - uv run python -m bike_doc_api.operations.alerts ../../deploy/alerts.json

  test:deployment:
    desc: Exercise isolated production topology, role ACLs, scaling and shutdown.
    cmds:
      - bash scripts/verify-production.sh
