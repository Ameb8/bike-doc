# Copy this file to ignored compose.override.yaml (or add it with -f) when GCS
# or Vertex AI needs a local credential file.
# GOOGLE_APPLICATION_CREDENTIALS in .env is its host path. Compose mounts it as
# a read-only secret and passes the container path to Google ADC.
services:
  api:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_application_credentials
    secrets:
      - google_application_credentials

secrets:
  google_application_credentials:
    file: ${GOOGLE_APPLICATION_CREDENTIALS:?Set GOOGLE_APPLICATION_CREDENTIALS to a credential file on the host}
