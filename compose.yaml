  BIKE_DOC_API_TELEMETRY_EXPORTER: ${BIKE_DOC_API_TELEMETRY_EXPORTER:-none}
  BIKE_DOC_API_TELEMETRY_OTLP_ENDPOINT: ${BIKE_DOC_API_TELEMETRY_OTLP_ENDPOINT:-}
  BIKE_DOC_API_TELEMETRY_SERVICE_NAME: ${BIKE_DOC_API_TELEMETRY_SERVICE_NAME:-bike-doc-api}
  BIKE_DOC_API_DIAGNOSTIC_TRACE_CONTENT: ${BIKE_DOC_API_DIAGNOSTIC_TRACE_CONTENT:-false}
  BIKE_DOC_API_ARTIFACT_STORAGE_PROVIDER: ${BIKE_DOC_API_ARTIFACT_STORAGE_PROVIDER:-local}
  BIKE_DOC_API_ARTIFACT_LOCAL_STORAGE_ROOT: ${BIKE_DOC_API_ARTIFACT_LOCAL_STORAGE_ROOT:-apps/api/.local/artifacts}
  BIKE_DOC_API_ARTIFACT_GCS_BUCKET: ${BIKE_DOC_API_ARTIFACT_GCS_BUCKET:-}
  BIKE_DOC_API_ARTIFACT_MAX_UPLOAD_BYTES: ${BIKE_DOC_API_ARTIFACT_MAX_UPLOAD_BYTES:-10485760}
