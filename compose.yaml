  BIKE_DOC_API_OBSERVATION_EXTRACTION_LLM_PROVIDER: ${BIKE_DOC_API_OBSERVATION_EXTRACTION_LLM_PROVIDER:-google_ai}
  BIKE_DOC_API_OBSERVATION_EXTRACTION_MODEL: ${BIKE_DOC_API_OBSERVATION_EXTRACTION_MODEL:-gemini-2.5-flash}
  BIKE_DOC_API_OBSERVATION_EXTRACTION_TIMEOUT_SECONDS: ${BIKE_DOC_API_OBSERVATION_EXTRACTION_TIMEOUT_SECONDS:-30}
  BIKE_DOC_API_OBSERVATION_EXTRACTION_EXTRACTOR_VERSION: ${BIKE_DOC_API_OBSERVATION_EXTRACTION_EXTRACTOR_VERSION:-visual-observation-extractor.v1}
  BIKE_DOC_API_OBSERVATION_EXTRACTION_PROMPT_VERSION: ${BIKE_DOC_API_OBSERVATION_EXTRACTION_PROMPT_VERSION:-visual-observation-prompt.v1}
  BIKE_DOC_API_DIAGNOSTIC_LLM_PROVIDER: ${BIKE_DOC_API_DIAGNOSTIC_LLM_PROVIDER:-google_ai}
  BIKE_DOC_API_DIAGNOSTIC_AGENT_MODEL: ${BIKE_DOC_API_DIAGNOSTIC_AGENT_MODEL:-gemini-2.5-flash}
  BIKE_DOC_API_DIAGNOSTIC_AGENT_TEMPERATURE: ${BIKE_DOC_API_DIAGNOSTIC_AGENT_TEMPERATURE:-0.2}
  BIKE_DOC_API_DIAGNOSTIC_AGENT_MAX_OUTPUT_TOKENS: ${BIKE_DOC_API_DIAGNOSTIC_AGENT_MAX_OUTPUT_TOKENS:-2048}
  BIKE_DOC_API_DIAGNOSTIC_AGENT_TIMEOUT_SECONDS: ${BIKE_DOC_API_DIAGNOSTIC_AGENT_TIMEOUT_SECONDS:-30}
  BIKE_DOC_API_PROFILE_INFERENCE_LLM_PROVIDER: ${BIKE_DOC_API_PROFILE_INFERENCE_LLM_PROVIDER:-google_ai}
  BIKE_DOC_API_PROFILE_INFERENCE_MODEL: ${BIKE_DOC_API_PROFILE_INFERENCE_MODEL:-gemini-2.5-flash}
  BIKE_DOC_API_PROFILE_INFERENCE_TIMEOUT_SECONDS: ${BIKE_DOC_API_PROFILE_INFERENCE_TIMEOUT_SECONDS:-30}
  BIKE_DOC_API_PROFILE_INFERENCE_MAX_ATTEMPTS: ${BIKE_DOC_API_PROFILE_INFERENCE_MAX_ATTEMPTS:-3}
  BIKE_DOC_API_PROFILE_INFERENCE_EXTRACTOR_VERSION: ${BIKE_DOC_API_PROFILE_INFERENCE_EXTRACTOR_VERSION:-drivetrain-specifications.v1}
  BIKE_DOC_API_PROFILE_INFERENCE_POLICY_MODE: ${BIKE_DOC_API_PROFILE_INFERENCE_POLICY_MODE:-shadow}
  BIKE_DOC_API_PROFILE_INFERENCE_POLICIES: ${BIKE_DOC_API_PROFILE_INFERENCE_POLICIES:-[]}
  BIKE_DOC_API_PRICE_LOOKUP_PROVIDER: ${BIKE_DOC_API_PRICE_LOOKUP_PROVIDER:-unavailable}
  BIKE_DOC_API_PRICE_LOOKUP_LLM_PROVIDER: ${BIKE_DOC_API_PRICE_LOOKUP_LLM_PROVIDER:-google_ai}
  BIKE_DOC_API_PRICE_LOOKUP_MODEL: ${BIKE_DOC_API_PRICE_LOOKUP_MODEL:-gemini-2.5-flash}
  BIKE_DOC_API_PRICE_LOOKUP_TEMPERATURE: ${BIKE_DOC_API_PRICE_LOOKUP_TEMPERATURE:-0.1}
  BIKE_DOC_API_PRICE_LOOKUP_MAX_OUTPUT_TOKENS: ${BIKE_DOC_API_PRICE_LOOKUP_MAX_OUTPUT_TOKENS:-1536}
  BIKE_DOC_API_PRICE_LOOKUP_TIMEOUT_SECONDS: ${BIKE_DOC_API_PRICE_LOOKUP_TIMEOUT_SECONDS:-20}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}

services:
  migrate:
    build: *api-build
    working_dir: /workspace/apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    working_dir: /workspace/apps/api
    command:
      - uvicorn
      - bike_doc_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${BIKE_DOC_API_PORT:-8000}"
      - --reload
      - --no-access-log
      - --reload-dir
      - /workspace/apps/api/src
      - --reload-dir
      - /workspace/docs/specs
    environment: *api-environment
    ports:
      - "${BIKE_DOC_API_PORT:-8000}:${BIKE_DOC_API_PORT:-8000}"
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./docs:/workspace/docs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.12.1-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  nats_data:
