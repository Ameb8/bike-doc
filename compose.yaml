x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile.dev

# Explicit runtime contract shared by API processes. Add worker-specific values
# under each worker service rather than passing the entire host .env file.
x-api-environment: &api-environment
  BIKE_DOC_API_APP_NAME: ${BIKE_DOC_API_APP_NAME:?Set BIKE_DOC_API_APP_NAME in .env}
  BIKE_DOC_API_ENVIRONMENT: ${BIKE_DOC_API_ENVIRONMENT:?Set BIKE_DOC_API_ENVIRONMENT in .env}
  BIKE_DOC_API_DEBUG: ${BIKE_DOC_API_DEBUG:?Set BIKE_DOC_API_DEBUG in .env}
  BIKE_DOC_API_CORS_ORIGINS: ${BIKE_DOC_API_CORS_ORIGINS:?Set BIKE_DOC_API_CORS_ORIGINS in .env}
  BIKE_DOC_API_DATABASE_URL: ${BIKE_DOC_API_DATABASE_URL_COMPOSE:?Set BIKE_DOC_API_DATABASE_URL_COMPOSE in .env}
  BIKE_DOC_API_NATS_URL: nats://nats:4222
  BIKE_DOC_API_EVENT_POLL_INTERVAL_SECONDS: ${BIKE_DOC_API_EVENT_POLL_INTERVAL_SECONDS:-2}
  BIKE_DOC_API_NATS_WORK_STREAM: ${BIKE_DOC_API_NATS_WORK_STREAM:-BIKEDOC_WORK_V1}
  BIKE_DOC_API_NATS_DIAGNOSTIC_SUBJECT: ${BIKE_DOC_API_NATS_DIAGNOSTIC_SUBJECT:-bikedoc.work.v1.diagnostic}
  BIKE_DOC_API_NATS_PROFILE_SUBJECT: ${BIKE_DOC_API_NATS_PROFILE_SUBJECT:-bikedoc.work.v1.profile}
  BIKE_DOC_API_NATS_DIAGNOSTIC_CONSUMER: ${BIKE_DOC_API_NATS_DIAGNOSTIC_CONSUMER:-bikedoc_diagnostic_v1}
  BIKE_DOC_API_NATS_PROFILE_CONSUMER: ${BIKE_DOC_API_NATS_PROFILE_CONSUMER:-bikedoc_profile_v1}
  BIKE_DOC_API_JOB_MAINTENANCE_ENABLED: ${BIKE_DOC_API_JOB_MAINTENANCE_ENABLED:-true}
  BIKE_DOC_API_JOB_PUBLICATION_BATCH_LIMIT: ${BIKE_DOC_API_JOB_PUBLICATION_BATCH_LIMIT:-16}
  BIKE_DOC_API_JOB_RECONCILIATION_BATCH_LIMIT: ${BIKE_DOC_API_JOB_RECONCILIATION_BATCH_LIMIT:-100}
  BIKE_DOC_API_JOB_PUBLICATION_POLL_SECONDS: ${BIKE_DOC_API_JOB_PUBLICATION_POLL_SECONDS:-1}
  BIKE_DOC_API_JOB_PUBLISH_TIMEOUT_SECONDS: ${BIKE_DOC_API_JOB_PUBLISH_TIMEOUT_SECONDS:-10}
  BIKE_DOC_API_JOB_PUBLICATION_CLAIM_SECONDS: ${BIKE_DOC_API_JOB_PUBLICATION_CLAIM_SECONDS:-30}
  BIKE_DOC_API_JOB_BACKOFF_INITIAL_SECONDS: ${BIKE_DOC_API_JOB_BACKOFF_INITIAL_SECONDS:-2}
  BIKE_DOC_API_JOB_BACKOFF_MAX_SECONDS: ${BIKE_DOC_API_JOB_BACKOFF_MAX_SECONDS:-60}
  BIKE_DOC_API_JOB_NO_PROGRESS_SECONDS: ${BIKE_DOC_API_JOB_NO_PROGRESS_SECONDS:-300}
  BIKE_DOC_API_JOB_RECONCILIATION_POLL_SECONDS: ${BIKE_DOC_API_JOB_RECONCILIATION_POLL_SECONDS:-30}
  BIKE_DOC_API_JOB_SHUTDOWN_TIMEOUT_SECONDS: ${BIKE_DOC_API_JOB_SHUTDOWN_TIMEOUT_SECONDS:-10}
  BIKE_DOC_API_AUTH_MODE: ${BIKE_DOC_API_AUTH_MODE:?Set BIKE_DOC_API_AUTH_MODE in .env}
  BIKE_DOC_API_DEV_AUTH_TOKEN: ${BIKE_DOC_API_DEV_AUTH_TOKEN:-dev-token}
  BIKE_DOC_API_DEV_AUTH_SUBJECT: ${BIKE_DOC_API_DEV_AUTH_SUBJECT:-dev-user}
  BIKE_DOC_API_DEV_AUTH_EMAIL: ${BIKE_DOC_API_DEV_AUTH_EMAIL:-dev@example.com}
  BIKE_DOC_API_DEV_AUTH_DISPLAY_NAME: ${BIKE_DOC_API_DEV_AUTH_DISPLAY_NAME:-Dev User}
  BIKE_DOC_API_FIREBASE_PROJECT_ID: ${BIKE_DOC_API_FIREBASE_PROJECT_ID:-}
  BIKE_DOC_API_LOG_LEVEL: ${BIKE_DOC_API_LOG_LEVEL:-}
  BIKE_DOC_API_LOG_FORMAT: ${BIKE_DOC_API_LOG_FORMAT:-}
